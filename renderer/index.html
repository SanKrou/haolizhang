<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>毫厘账</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="titlebar">
    <div class="tb-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <circle cx="12" cy="12" r="10.5" fill="#33302a"/>
        <rect x="8" y="8" width="8" height="8" fill="#f8f5ee"/>
        <rect x="10.7" y="10.7" width="2.6" height="2.6" fill="#b3452f"/>
      </svg>
    </div>
    <span class="tb-brand">毫厘账</span>
    <span class="tb-page" id="tb-page">记一笔</span>
    <div class="tb-btns">
      <button class="tb-btn" id="tb-min" data-tip="最小化" aria-label="最小化">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="1.5" y1="6" x2="10.5" y2="6"/></svg>
      </button>
      <button class="tb-btn" id="tb-max" data-tip="最大化" aria-label="最大化">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.8" y="1.8" width="8.4" height="8.4" rx="0.5"/></svg>
      </button>
      <button class="tb-btn close" id="tb-close" data-tip="关闭" aria-label="关闭">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>
      </button>
    </div>
  </header>
  <div id="app-area">
    <aside id="sidebar">
      <button class="nav-btn active" data-view="add">记一笔</button>
      <button class="nav-btn" data-view="ledger">账本</button>
      <button class="nav-btn" data-view="stats">统计</button>
    </aside>
    <main id="view-root"></main>
  </div>
  <div id="balance-dock">
    <div class="bb-left">
      <div class="bb-range" id="bd-range"></div>
      <div id="bd-body"></div>
    </div>
    <div class="bb-poem" id="bb-poem" title="点击换一句">
      <span class="poem-line" id="poem-line"></span><span class="poem-src" id="poem-src"></span>
    </div>
    <div class="bb-sep"></div>
    <div class="bb-cal">
      <div class="cal-head">
        <input type="number" id="inp-year" class="y" min="1900" max="2100" />
        <span class="unit">年</span>
        <input type="number" id="inp-month" min="1" max="12" />
        <span class="unit">月</span>
        <button type="button" class="cal-nav" id="cal-prev">◀</button>
        <button type="button" class="cal-nav" id="cal-next">▶</button>
      </div>
      <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
  <script src="../node_modules/echarts/dist/echarts.min.js"></script>
  <script src="pages/add.js"></script>
  <script src="pages/ledger.js"></script>
  <script src="pages/stats.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
